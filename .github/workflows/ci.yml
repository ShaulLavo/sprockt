name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  BUN_VERSION: 1.4.4

jobs:
  # Formatting, lint, the no-JavaScript rule, types and unit tests. Nothing here needs a browser
  # or the WASM guests.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: bun run check

  # The production build, then the end-to-end suite in Chromium, Firefox and WebKit. The job runs
  # in Playwright's image, which carries the three browsers and their system libraries: installing
  # those libraries on a plain runner took over two minutes of every run. Keep the image tag on
  # the same version as @playwright/test.
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --user 1001 --ipc=host
    env:
      SPROCKT_GUEST_CACHE: ${{ github.workspace }}/.guest-cache
    steps:
      - uses: actions/checkout@v5
      # setup-bun needs unzip, which the image lacks; its Node installs Bun instead.
      - name: Install Bun
        run: |
          npm install --global --prefix "$HOME/.local" "bun@$BUN_VERSION"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-playwright-${{ hashFiles('bun.lock') }}
          restore-keys: bun-playwright-
      - uses: actions/cache@v4
        with:
          path: .guest-cache
          key: guests-${{ hashFiles('guests.lock.json') }}
      - run: bun install --frozen-lockfile
      # The build stages and verifies the pinned guests first, from the cache when it has them.
      - run: bun run build
      - run: bun run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results
          retention-days: 7
